name: Validate installer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\Install-BloodHoundCE.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell parser found $($errors.Count) error(s)."
          }

      - name: Verify required files
        shell: pwsh
        run: |
          @(
            'Install-BloodHoundCE.ps1',
            'Instalar-BloodHoundCE.cmd',
            'README.md',
            'README.es.md',
            'LICENSE',
            'SECURITY.md'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_)) {
              throw "Missing required file: $_"
            }
          }
